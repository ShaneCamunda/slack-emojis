name: Update catalog

on:
  push:
    branches: [main]
    paths:
      - "emojis/**"
      - "scripts/update_catalog.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild catalog table
        run: python3 scripts/update_catalog.py

      - name: Commit if the table changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update emoji catalog [skip ci]"
          git push
